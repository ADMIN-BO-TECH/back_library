name: Publish - GitHub Packages

on:
  push:
    branches:
      - "main"
      - "dev"
      - "*/*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish Library Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Extract or Generate Version
        id: version-generation
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash

        run: |
          echo "Branch: $BRANCH_NAME"

          if [ "$BRANCH_NAME" = "main" ]; then
            ENVIRONMENT="PROD"

          elif [ "$BRANCH_NAME" = "dev" ]; then
            ENVIRONMENT="DEV"

          else
            TICKET=${BRANCH_NAME%%/*}
            ENVIRONMENT="BOTECH-TICKET-$TICKET"
            echo "Ticket branch detected: $TICKET"
          fi

          echo "Environment: $ENVIRONMENT"

          COMMIT_MSG=$(git log -1 --pretty=%B)

          LAST_TAG=$(git tag -l "$ENVIRONMENT-*" | sort -V | tail -n 1)

          if [ -z "$LAST_TAG" ]; then
            MAJOR=1
            MINOR=0
            PATCH=0
          else
            VERSION=${LAST_TAG#"$ENVIRONMENT-"}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            if [[ "$COMMIT_MSG" == *"[major]"* ]]; then
              MAJOR=$((MAJOR+1))
              MINOR=0
              PATCH=0
            elif [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
              MINOR=$((MINOR+1))
              PATCH=0
            else
              PATCH=$((PATCH+1))
            fi
          fi

          NEW_VERSION="$ENVIRONMENT-$MAJOR.$MINOR.$PATCH"

          echo "New version: $NEW_VERSION"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

      - name: Create Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Set Maven project version
        run: |
          mvn -B -s ~/.m2/settings.xml versions:set \
            -DnewVersion="${{ steps.version-generation.outputs.version }}" \
            -DgenerateBackupPoms=false

      - name: Build & Deploy
        run: |
          mvn -B -s ~/.m2/settings.xml clean deploy -DskipTests

      - name: Create Git Tag
        run: |
          VERSION=${{ steps.version-generation.outputs.version }}
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Publish Summary
        run: |
          echo "## Library Version Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version-generation.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Environment" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.version-generation.outputs.environment }} " >> $GITHUB_STEP_SUMMARY