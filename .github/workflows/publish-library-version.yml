name: Publish - GitHub Packages

on:
  push:
    branches:
      - "main"
      - "dev"
      - "*/*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Extract or Generate Version
        id: version-generation
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          TOKEN: ${{ secrets.BOTECH_TOKEN }}
        shell: bash

        run: |
          echo "Branch: $BRANCH_NAME"

          if [ "$BRANCH_NAME" = "main" ]; then
            ENVIRONMENT="PROD"

          elif [ "$BRANCH_NAME" = "dev" ]; then
            ENVIRONMENT="DEV"
          else
            TICKET=${BRANCH_NAME%%/*}
            ENVIRONMENT="BOTECH-TICKET-$TICKET"
            echo "Ticket branch detected: $TICKET"
          fi

          echo "Generating $ENVIRONMENT version..."

          COMMIT_MSG=$(git log -1 --pretty=%B)

          LAST_VERSION=$(curl -s -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/ADMIN-BO-TECH/packages/maven/co.com.botech.botech-back-library/versions" \
            | jq -r '.[].name' \
            | grep "^$ENVIRONMENT-" \
            | sed "s/$ENVIRONMENT-//" \
            | sort -V \
            | tail -n 1 || true)

          if [ -z "$LAST_VERSION" ]; then
            MAJOR=1
            MINOR=0
            PATCH=0
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"

            if [[ "$COMMIT_MSG" == *"[major]"* ]]; then
              MAJOR=$((MAJOR+1))
              MINOR=0
              PATCH=0
            elif [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
              MINOR=$((MINOR+1))
              PATCH=0
            else
              PATCH=$((PATCH+1))
            fi
          fi

          NEW_VERSION="$ENVIRONMENT-$MAJOR.$MINOR.$PATCH"

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

      - name: Create Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Set Maven project version
        run: |
          mvn -B -s ~/.m2/settings.xml versions:set \
            -DnewVersion="${{ steps.version-generation.outputs.version }}" \
            -DgenerateBackupPoms=false

      - name: Build & Deploy
        run: |
          mvn -B -s ~/.m2/settings.xml clean deploy -DskipTests

      - name: Publish Summary
        run: |
          echo "## Library Version Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version-generation.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Environment " >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.version-generation.outputs.environment }}" >> $GITHUB_STEP_SUMMARY