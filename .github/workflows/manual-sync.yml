name: Update Repositories

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to update
        required: true
        type: choice
        options:
          - dev
          - main

      ScheduleJobs:
        description: ScheduleJobs
        type: boolean

      tracking-api:
        description: tracking-api
        type: boolean

      PassApi:
        description: PassApi
        type: boolean

      seguimiento-api:
        description: seguimiento-api
        type: boolean


jobs:

  build-matrix:
    name: Build Repositories Matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Build Matrix
        id: set-matrix
        run: |
          repos=()
          if [ "${{ inputs.ScheduleJobs }}" = "true" ]; then
          repos+=("ScheduleJobs")
          fi
          if [ "${{ inputs.tracking-api }}" = "true" ]; then
          repos+=("tracking-api")
          fi
          if [ "${{ inputs.PassApi }}" = "true" ]; then
          repos+=("PassApi")
          fi
          if [ "${{ inputs.seguimiento-api }}" = "true" ]; then
          repos+=("seguimiento-api")
          fi
          
          matrix_json=$(printf '%s\n' "${repos[@]}" | jq -R . | jq -s -c .)
          echo "Selected repositories: $matrix_json"

          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT


  update-repositories:
    name: Sync Repositories
    needs: build-matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:

      - name: Call Repository Workflow
        id: dispatch
        run: |

          ENVIRONMENT="${{ inputs.environment }}"
          REPOSITORY="${{ matrix.repo }}"

          echo "Triggering update for $REPOSITORY on branch $ENVIRONMENT"

          RESPONSE=$(curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.BOTECH_TOKEN }}" \
            https://api.github.com/repos/ADMIN-BO-TECH/$REPOSITORY/actions/workflows/continous-integration.yml/dispatches \
            -d "{
            \"ref\": \"${ENVIRONMENT}\",
            \"inputs\": {
              \"branch\": \"${ENVIRONMENT}\"
            }
          }")
          
          # Mostrar la respuesta completa
          echo "Response: $RESPONSE"
          
          # Si quieres chequear si fue exitoso (204 No Content es la respuesta de GitHub)
            if [[ "$RESPONSE" == *"\"message\""* ]]; then
            echo "Failed to trigger workflow"
            RESULT="FAILED"
            else
            echo "Workflow dispatched successfully"
            RESULT="SUCCESS"
            fi
            
            echo "result=$RESULT" >> $GITHUB_OUTPUT


      - name: Add repository result to summary
        if: always()
        run: |
          REPOSITORY="${{ matrix.repo }}"
          RESULT="${{ steps.dispatch.outputs.result }}"
          if [ "$RESULT" = "SUCCESS" ]; then
            STATUS="✅ SUCCESS TO INVOKE"
          else
            STATUS="❌ FAILED TO INVOKE"
          fi
          echo "$REPOSITORY -> $STATUS" >> summary.txt
      - name: Summary Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.repo }}
          path: summary.txt


  summary:
    name: Final Summary
    needs: update-repositories
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/download-artifact@v4
      - name: Build Final Report
        run: |
          
          echo "## Library Update Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for file in result-*/*.txt; do
            cat "$file" >> $GITHUB_STEP_SUMMARY
          done