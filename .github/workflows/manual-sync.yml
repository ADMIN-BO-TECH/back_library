name: Update Repositories

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to update
        required: true
        type: choice
        options:
          - dev
          - main

      ScheduleJobs:
        description: ScheduleJobs
        type: boolean

      tracking-api:
        description: tracking-api
        type: boolean

      PassApi:
        description: PassApi
        type: boolean

      seguimiento-api:
        description: seguimiento-api
        type: boolean

      SocketAsistencia:
        description: 8078-SocketAsistencia
        type: boolean

      cardinal-api:
        description: cardinal-api
        type: boolean

      n8n-api:
        description: n8n-api
        type: boolean

      boss-api:
        description: boss-api
        type: boolean

      user-geofence:
        description: user-geofence
        type: boolean


jobs:

  build-matrix:
    name: Build Repositories Matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Build Matrix
        id: set-matrix
        run: |
          repos=()
          if [ "${{ inputs.ScheduleJobs }}" = "true" ]; then
          repos+=("ScheduleJobs")
          fi
          if [ "${{ inputs.tracking-api }}" = "true" ]; then
          repos+=("tracking-api")
          fi
          if [ "${{ inputs.PassApi }}" = "true" ]; then
          repos+=("PassApi")
          fi
          if [ "${{ inputs.seguimiento-api }}" = "true" ]; then
          repos+=("seguimiento-api")
          fi
          if [ "${{ inputs.SocketAsistencia }}" = "true" ]; then
          repos+=("8078-SocketAsistencia")
          fi
          if [ "${{ inputs.cardinal-api }}" = "true" ]; then
          repos+=("cardinal-api")
          fi
          if [ "${{ inputs.n8n-api }}" = "true" ]; then
          repos+=("n8n-api")
          fi
          if [ "${{ inputs.boss-api }}" = "true" ]; then
          repos+=("boss-api")
          fi
          if [ "${{ inputs.user-geofence }}" = "true" ]; then
          repos+=("user-geofence")
          fi
          
          matrix_json=$(printf '%s\n' "${repos[@]}" | jq -R . | jq -s -c .)
          echo "Selected repositories: $matrix_json"

          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT


  update-repositories:
    name: Sync Repositories
    needs: build-matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Trigger Repository CI
        id: ci
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: ADMIN-BO-TECH
          repo: ${{ matrix.repo }}
          github_token: ${{ secrets.BOTECH_TOKEN }}
          workflow_file_name: continous-integration.yml
          ref: ${{ inputs.environment }}
          client_payload: '{"branch": "${{ inputs.environment }}"}'
          wait_interval: 30

      - name: Trigger Update And Deploy
        id: build
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: ADMIN-BO-TECH
          repo: ${{ matrix.repo }}
          github_token: ${{ secrets.BOTECH_TOKEN }}
          workflow_file_name: update-library-version-and-publish.yml
          ref: ${{ inputs.environment }}
          client_payload: '{"branch": "${{ inputs.environment }}"}'
          wait_interval: 30
